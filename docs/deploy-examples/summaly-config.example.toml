# summaly Fastify モードの設定例（deploy 向け）。
# `pnpm serve /etc/summaly/config.toml` で読み込む想定。
# 詳細は /config.example.toml またはリポジトリの docs/SETUP.md を参照。

[server]
host = "127.0.0.1"
port = 3000

[summaly]
responseTimeout = 20000
operationTimeout = 60000
contentLengthLimit = 10485760
useRange = true

[summaly.cache]
maxAge = 604800
errorMaxAge = 3600
inMemory = true
inMemoryMaxEntries = 1000
inFlightDedup = true

[summaly.pdf]
enabled = false

[scraping.fallback]
# bot block (4xx / WAF 黙殺) に当たったら別 UA で 1 回リトライ (phase11.9)
enabled = true
userAgent = "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"
categories = ["bot_blocked", "connection_dropped"]

[scraping.proxy]
# CF Workers proxy 経由の救援 (phase12.1)。Amazon class IP block 用。
# secret は env SUMMALY_PROXY_SECRET 経由で渡すこと推奨（TOML 直書きを避ける）。
# Worker のデプロイ手順は tools/cf-proxy-worker/README.md 参照。
# enabled = true
# url = "https://summaly-proxy.<your>.workers.dev"
# categories = ["origin_error", "bot_blocked"]   # bot_blocked は `Rejected by type filter undefined` も含む
# domains = [                                    # Worker 側 ALLOWED_DOMAINS と同期させる
#   "amazon.co.jp", "amazon.com",                # Amazon 商品ページ (TLD ごとに列挙)
#   "amzn.asia", "amzn.to", "a.co",              # Amazon 短縮 URL (resolveRedirect 失敗時の fallback)
#   "store.jp.square-enix.com",                   # Square Enix e-STORE (phase12.6 / sqex プラグインで forceProxyFallback)
# ]
# timeoutMs = 30000

[scraping.curl_cffi]
# curl_cffi (libcurl-impersonate) を使った TLS layer bot block 救援 (phase12.5)。
# proxy fallback でも救えない TLS フィンガープリント層の切断 (yodobashi 等) を、
# `tools/curl-cffi-fetcher/` の Python CLI を spawn して Chrome TLS フィンガープリント偽装で救援する。
# **運用要件**: production server に `uv` を別途インストール + `uv sync` 必須。
# 詳細は tools/curl-cffi-fetcher/README.md 参照。
# enabled = true
# projectDir = "/path/to/summaly/tools/curl-cffi-fetcher"
# uvPath = "uv"                                  # PATH 上の `uv` を使う場合は省略可
# impersonate = "chrome120"                      # firefox120 / safari17_0 等も可
# categories = ["timeout", "connection_dropped", "bot_blocked"]
# domains = ["yodobashi.com"]                    # 必須。任意 URL ブラウザ偽装の悪用防止
# timeoutMs = 30000

[scraping.strategy_cache]
# 経路学習キャッシュ (phase14 Step 1)。host + path prefix 1〜2 段ごとに成功経路を学習・永続化。
# **注**: Step 1 はストレージ層のみ。`scpaping()` 統合は Step 2 (現時点では設定しても挙動は変わらない)。
# enabled = true                                          # デフォルト ON
# runtimePath = "/var/cache/summaly/domain-strategy.jsonl" # 学習結果の永続化先
# bootstrapPath = "data/domain-strategy-bootstrap.jsonl"   # リポ同梱の初期データ (省略時は bootstrap なし、Step 3 で同梱予定)
# maxEntries = 5000
# consecutiveFailureThreshold = 3                         # N 連続失敗で破棄
# compactionThreshold = 1000

[diagnostics]
# 迂回候補ログ (phase11.6) を有効化したい場合の例:
# parseFailureLog = true
# parseFailureLogJsonlPath = "/var/log/summaly/parse-failures.jsonl"
# parseFailureLogBlockedJsonlPath = "/var/log/summaly/parse-failures-blocked.jsonl"

[plugins]
allowed = [
  "amazon",
  "bluesky",
  "wikipedia",
  "branchio-deeplinks",
  "youtube",
  "spotify",
  "twitter",
  "npmjs",
  "nintendo-store",
  "yodobashi",
  "sqex",
  # 性的コンテンツを含むサイトの組み込みプラグイン。有効化したい場合のみコメントを外す:
  # "dlsite",
  # "iwara",
  # "komiflo",
  # "nijie",
]
