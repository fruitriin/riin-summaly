# summaly Fastify モードの設定例（deploy 向け）。
# `pnpm serve /etc/summaly/config.toml` で読み込む想定。
# 詳細は /config.example.toml またはリポジトリの docs/SETUP.md を参照。

[server]
host = "127.0.0.1"
port = 3000

[summaly]
responseTimeout = 20000
operationTimeout = 60000
contentLengthLimit = 10485760
useRange = true

[summaly.cache]
maxAge = 604800
errorMaxAge = 3600
inMemory = true
inMemoryMaxEntries = 1000
inFlightDedup = true

[summaly.pdf]
enabled = false

[scraping.fallback]
# bot block (4xx / WAF 黙殺) に当たったら別 UA で 1 回リトライ (phase11.9)
enabled = true
userAgent = "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"
categories = ["bot_blocked", "connection_dropped"]

[scraping.proxy]
# CF Workers proxy 経由の救援 (phase12.1)。Amazon class IP block 用。Step 1.3 GO 確定済み。
# secret は env SUMMALY_PROXY_SECRET 経由で渡すこと推奨（TOML 直書きを避ける）。
# Worker のデプロイ手順は tools/cf-proxy-worker/README.md 参照。
# enabled = true
# url = "https://summaly-proxy.<your>.workers.dev"
# categories = ["origin_error"]
# domains = [                                  # Worker 側 ALLOWED_DOMAINS と同期させる
#   "amazon.co.jp", "amazon.com",               # Amazon 商品ページ
#   "amzn.asia", "amzn.to", "a.co",             # Amazon 短縮 URL (resolveRedirect 失敗時の fallback)
# ]
# timeoutMs = 30000

[diagnostics]
# 迂回候補ログ (phase11.6) を有効化したい場合の例:
# parseFailureLog = true
# parseFailureLogJsonlPath = "/var/log/summaly/parse-failures.jsonl"
# parseFailureLogBlockedJsonlPath = "/var/log/summaly/parse-failures-blocked.jsonl"

[plugins]
allowed = [
  "amazon",
  "bluesky",
  "wikipedia",
  "branchio-deeplinks",
  "youtube",
  "spotify",
  "twitter",
  "npmjs",
  # 性的コンテンツを含むサイトの組み込みプラグイン。有効化したい場合のみコメントを外す:
  # "dlsite",
  # "iwara",
  # "komiflo",
  # "nijie",
]
